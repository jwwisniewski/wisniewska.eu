<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="error-container">
    <div class="error-code">403</div>
    <div class="error-message">Access Denied</div>
    <div class="error-detail">You don't have permission to access this page.</div>
    <a th:href="${path != null && #strings.startsWith(path, '/_admin')} ? @{/_admin} : @{/}" class="btn-home" th:text="${path != null && #strings.startsWith(path, '/_admin')} ? 'Go to Admin' : 'Go Home'">Go Home</a>
</div>
</body>
</html>
