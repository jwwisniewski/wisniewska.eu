<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status} + ' - Error'">Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="error-container">
    <div class="error-code" th:text="${status}">Error</div>
    <div class="error-message" th:text="${error}">Something went wrong</div>
    <div class="error-detail" th:text="${message != null && !message.isEmpty()} ? ${message} : 'An unexpected error occurred.'"></div>
    <a th:href="${path != null && #strings.startsWith(path, '/_admin')} ? @{/_admin} : @{/}" class="btn-home" th:text="${path != null && #strings.startsWith(path, '/_admin')} ? 'Go to Admin' : 'Go Home'">Go Home</a>
</div>
</body>
</html>
