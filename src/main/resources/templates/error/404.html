<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="error-container">
    <div class="error-code">404</div>
    <div class="error-message">Page not found</div>
    <div class="error-detail" th:text="${path != null ? 'The page ' + path + ' does not exist.' : 'The requested page does not exist.'}"></div>
    <a th:href="${path != null && #strings.startsWith(path, '/_admin')} ? @{/_admin} : @{/}" class="btn-home" th:text="${path != null && #strings.startsWith(path, '/_admin')} ? 'Go to Admin' : 'Go Home'">Go Home</a>
</div>
</body>
</html>
