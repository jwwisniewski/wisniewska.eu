<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${pageTitle})}"/>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments :: sidebar(${activePage})}"></div>
    <div class="admin-content">
        <main class="p-4">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/_admin}"><i class="bi bi-house-door me-1"></i>Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/_admin/users}">Users</a></li>
                    <li class="breadcrumb-item active">Add User</li>
                </ol>
            </nav>
            <h1 class="mb-4">Create a new Admin User</h1>
            <div style="max-width: 500px;">
                <form th:object="${adminUserCreateForm}" th:action="@{/_admin/users/save}" method="post">
                    <div class="form-floating mb-3">
                        <input type="text" id="username" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" placeholder="Username">
                        <label for="username">Username</label>
                        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="invalid-feedback"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" id="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Password">
                        <label for="password">Password</label>
                        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <select id="role" th:field="*{role}" class="form-select" th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                            <option value="" th:selected="${adminUserCreateForm.role == null}">Choose role...</option>
                            <option th:each="role : ${adminUserRoles}" th:value="${role}" th:text="${role}"></option>
                        </select>
                        <label for="role">Role</label>
                        <div th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="invalid-feedback"></div>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Create User</button>
                </form>
            </div>
        </main>
        <footer th:replace="~{admin/fragments :: footer}"></footer>
    </div>
</div>
<script th:replace="~{admin/fragments :: scripts}"></script>
</body>
</html>
