<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${pageTitle})}"/>
<body>
<nav th:replace="~{admin/fragments :: nav(${activePage})}"></nav>
<a th:href="@{/_admin/users}">Back to Users</a>
<h1>Create a new Admin User</h1>
<section>
    <form
            th:object="${adminUser}"
            th:action="@{/_admin/users/save}"
            method="post"
    >
        <table>
            <tr>
                <th>
                    <label for="username">Username:</label>
                </th>
                <td>
                    <input type="text" id="username" name="username" required>
                    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message"></span>
                </td>
            </tr>
            <tr>
                <th>
                    <label for="password">Password:</label>
                </th>
                <td>
                    <input type="password" id="password" name="password" required>
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></span>
                </td>
            </tr>
            <tr>
                <th>
                    <label for="role">Role:</label>
                </th>
                <td>
                    <select id="role" name="role">
                        <option value="ADMIN">Admin</option>
                        <option value="USER">User</option>
                    </select>
                    <span th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="error-message"></span>
                </td>
            </tr>
            <tr>
                <th colspan="2">
                    <button type="submit">Create User</button>
                </th>
            </tr>
        </table>
    </form>

</section>
</body>
</html>
