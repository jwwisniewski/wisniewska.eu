<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${pageTitle})}"/>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments :: sidebar(${activePage})}"></div>
    <div class="admin-content">
        <main class="p-4">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/_admin}"><i class="bi bi-house-door me-1"></i>Dashboard</a></li>
                    <li class="breadcrumb-item active">Users</li>
                </ol>
            </nav>
            <h1>Admin Users</h1>
            <a th:href="@{/_admin/users/add}" class="btn btn-primary mb-3"><i class="bi bi-plus-lg me-1"></i>Add User</a>
            <div th:replace="~{admin/fragments :: flash}"></div>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}"></td>
                    <td><span class="badge" th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'" th:text="${user.role}"></span></td>
                    <td>
                        <a th:href="@{/_admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil me-1"></i>Edit</a>
                        <form th:action="@{/_admin/users/delete/{id}(id=${user.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')"><i class="bi bi-trash me-1"></i>Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </main>
        <footer th:replace="~{admin/fragments :: footer}"></footer>
    </div>
</div>
<script th:replace="~{admin/fragments :: scripts}"></script>
</body>
</html>
