<head th:fragment="head(pageTitle)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Anna Wiśniewska - ' + ${pageTitle}">Anna Wiśniewska - Default Panel Title</title>
    <link href="https://fonts.cdnfonts.com/css/cleanvertising" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<nav th:fragment="nav(activePage)">
    <ul>
        <li>
            <a th:href="@{/_admin}" th:classappend="${activePage == 'index'} ? 'active'">Panel Home</a>
        </li>
        <li>
            <a th:href="@{/_admin/users}" th:classappend="${activePage == 'users'} ? 'active'">Users</a>
        </li>
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </li>
    </ul>
</nav>
