<head th:fragment="head(pageTitle)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Anna Wiśniewska'">Default Panel Title - Anna Wiśniewska</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/cleanvertising" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<div th:fragment="sidebar(activePage)" class="d-flex flex-column flex-shrink-0 sidebar text-center">
    <a th:href="@{/_admin}" class="d-block p-1 text-white text-decoration-none border-bottom border-secondary" data-bs-toggle="tooltip" data-bs-placement="right" title="Admin Panel">
        <img th:src="@{/img/cherry-logo.png}" alt="Admin" style="width: 48px; height: auto;">
    </a>
    <ul class="nav nav-pills nav-flush flex-column mb-auto">
        <li class="nav-item">
            <a class="nav-link py-3 text-white" th:classappend="${activePage == 'users'} ? 'active'" th:href="@{/_admin/users}" data-bs-toggle="tooltip" data-bs-placement="right" title="Users">
                <i class="bi bi-people fs-5"></i>
            </a>
        </li>
    </ul>
    <form th:action="@{/logout}" method="post" class="border-top border-secondary">
        <button type="submit" class="btn text-white py-3 w-100" data-bs-toggle="tooltip" data-bs-placement="right" title="Logout">
            <i class="bi bi-box-arrow-left fs-5"></i>
        </button>
    </form>
</div>

<div th:fragment="flash" th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<footer th:fragment="footer" class="footer">
    <div class="d-flex justify-content-between align-items-center px-2">
        <small>&copy; 2026 Anna Wiśniewska</small>
        <small th:text="${@environment.getActiveProfiles().length > 0 ? @environment.getActiveProfiles()[0] : 'default'}" class="badge bg-secondary"></small>
    </div>
</footer>

<th:block th:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
        new bootstrap.Tooltip(el);
    });
</script>
</th:block>
