spring:
  application:
    name: www
  datasource:
    url: jdbc:h2:file:./data/eu.wisniewska
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: "/**"
      cache:
        cachecontrol:
          max-age: 365d

server:
  port: 8181

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  admin:
    username: admin
    password: qwertyuiop
    role: ADMIN
    remember-me-key: secret-key
    remember-me-cookie-name: remember-me-cookie